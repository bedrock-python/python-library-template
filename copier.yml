project_name:
  type: str
  help: "Display name (e.g. my-library)"

project_slug:
  type: str
  help: "PyPI package name, kebab-case (e.g. my-library)"
  default: "{{ project_name | lower | replace(' ', '-') }}"

package_name:
  type: str
  help: "Python import name, snake_case (e.g. my_library)"
  default: "{{ project_slug | replace('-', '_') }}"

project_description:
  type: str
  help: "One-line description for pyproject.toml and docs"

author_name:
  type: str
  help: "Author full name"

author_email:
  type: str
  help: "Author email"

github_org:
  type: str
  help: "GitHub organization or username"
  default: "bedrock-python"

python_min_version:
  type: str
  help: "Minimum Python version"
  default: "3.11"

initial_version:
  type: str
  help: "Initial version"
  default: "0.1.0"

_subdirectory: template

_tasks:
  - >-
    echo "\n✓ Template generated!\n\nNext steps:\n
    1. cd into your project and run: uv sync --group dev\n
    2. uv run pre-commit install --hook-type commit-msg\n
    3. Create GitHub repo and push\n
    4. bash scripts/setup-repo.sh  (after first CI pass)\n
    5. Configure PyPI Trusted Publisher at pypi.org\n
    6. Add CODECOV_TOKEN secret\n\nSee NEW_LIBRARY_CHECKLIST.md for full details."
