project_name:
  type: str
  help: "Display name (e.g. my-library)"

project_slug:
  type: str
  help: "PyPI package name, kebab-case (e.g. my-library)"
  default: "{{ project_name | lower | replace(' ', '-') }}"

package_name:
  type: str
  help: "Python import name, snake_case (e.g. my_library)"
  default: "{{ project_slug | replace('-', '_') }}"

project_description:
  type: str
  help: "One-line description for pyproject.toml and docs"

author_name:
  type: str
  help: "Author full name"

author_email:
  type: str
  help: "Author email"

github_org:
  type: str
  help: "GitHub organization or username"
  default: "bedrock-python"

python_min_version:
  type: str
  help: "Minimum Python version"
  default: "3.11"

initial_version:
  type: str
  help: "Initial version (keep 0.0.0 — Release Please cuts the first real release)"
  default: "0.0.0"

_subdirectory: template

_jinja_extensions:
  - jinja2_time.TimeExtension

_tasks:
  - >-
    echo "Template generated. Next steps:
    1. uv sync --group dev
    2. uv run pre-commit install --hook-type commit-msg
    3. Create the GitHub repo and push (branch: master)
    4. After the first CI pass, from the template repo:
    python scripts/setup_repo.py {{ github_org }}/{{ project_slug }}
    5. Configure the PyPI Trusted Publisher at pypi.org
    6. Add the CODECOV_TOKEN secret.
    See NEW_LIBRARY_CHECKLIST.md for full details."
